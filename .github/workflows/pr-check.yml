---
name: PR Check

on:
  pull_request: 
    branches:
      - main
      - test
      - staging

jobs:
  file-size-check:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          MAX_SIZE=$((1024 * 1024))  # 1 MB
          FAILED=false

          echo "Checking files changed in this PR..."

          for file in $(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"); do

            if [[ -f "$file" ]]; then
              SIZE=$(stat -c%s "$file")

              echo "$file: $SIZE bytes"

              if [[ "$SIZE" -gt "$MAX_SIZE" ]]; then
                echo "❌ $file is larger than 1 MB"
                FAILED=true
              fi
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            echo "❌ File size check failed."
            exit 1
          fi

          echo "✅ All changed files are within the 1 MB limit."

  branch-name-check:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Name
        run: echo "Branch Name - ${{ github.head_ref }}"

      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"

          echo "Checking branch: $BRANCH"

          if [[ "$BRANCH" == feature/* ||
                "$BRANCH" == fix/* ||
                "$BRANCH" == docs/* ]]; then
            echo "Valid branch name: $BRANCH"
          else
            echo "Invalid branch name: $BRANCH"
            echo "Allowed patterns: feature/*, fix/*, docs/*"
            exit 1
          fi

  pr-body-check:
    runs-on: ubuntu-latest
    steps:
      - name: PR Body
        run: echo "PR body - ${{ github.event.pull_request.body }}"

      - name: Check if PR description is empty
        run: |
          BODY="${{ github.event.pull_request.body }}"
          # Trim whitespace using standard bash manipulation
          TRIMMED_BODY=$(echo "$BODY" | xargs)
          
          if [ -z "$TRIMMED_BODY" ]; then
            echo "::warning::The pull request description is empty. Please add a description."
          else
            echo "PR description is provided."
          fi
