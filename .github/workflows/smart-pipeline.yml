---
name: Smart Pipeline
on:
  push:

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Lint Check
        run: echo "Running Linter"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Testing Code
        run: echo "Running Tests"

  summary:
    runs-on: ubuntu-latest
    needs:
      - linter
      - test
    steps:
      - name: Info
        run: |
          echo "The active branch is: ${{ github.ref_name }}"
          echo "The latest commit message is: ${{ github.event.head_commit.message }}"
