---
name: Variables Levels
on:
  workflow_dispatch:

# 1. WORKFLOW LEVEL: Available everywhere in this file
env:
  APP_NAME: MyApp

jobs:
  example:
    runs-on: ubuntu-latest
    # 2. JOB LEVEL: Available only to steps in this job
    env:  
      ENVIRONMENT: staging
      VERSION: 1.1.1
    steps:
      - name: Info
        # 3. STEP LEVEL: Available only in this specific execution block
        env:
          VERSION: 1.0.0
        run: |
          echo "App is : $APP_NAME"
          echo "Environment is : $ENVIRONMENT"
          echo "Version is : $VERSION"

      - name: Info 2
        run: |
          echo "Version is : $VERSION"
        
